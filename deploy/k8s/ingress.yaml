apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dookdak-ingress
  namespace: dookdak
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket 지원
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # SSL Redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # cert-manager (TLS 자동 발급)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dookdak.internal
        - dookdak.company.com
      secretName: dookdak-tls
  rules:
    # Frontend
    - host: dookdak.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dookdak-frontend-service
                port:
                  number: 80
    # API
    - host: dookdak.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dookdak-api-service
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: dookdak-api-service
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: dookdak-api-service
                port:
                  number: 80
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: dookdak-frontend-service
  namespace: dookdak
spec:
  selector:
    app: dookdak-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# PersistentVolumeClaims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dookdak-inventory-pvc
  namespace: dookdak
spec:
  accessModes: [ReadWriteMany]  # NFS or Azure Files / EFS
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dookdak-artifacts-pvc
  namespace: dookdak
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-client
