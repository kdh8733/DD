apiVersion: apps/v1
kind: Deployment
metadata:
  name: dookdak-worker
  namespace: dookdak
  labels:
    app: dookdak-worker
    component: worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: dookdak-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dookdak-worker
    spec:
      serviceAccountName: dookdak-worker
      # Ansible Worker는 SSH 키 필요하므로 높은 권한
      securityContext:
        runAsUser: 1001  # ansible user
      containers:
        - name: worker
          image: your-registry/dookdak-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dookdak-config
            - secretRef:
                name: dookdak-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            - name: playbooks
              mountPath: /opt/dookdak/playbooks
              readOnly: true
            - name: inventory
              mountPath: /opt/dookdak/inventory
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/dookdak/artifacts
            - name: ssh-key
              mountPath: /home/ansible/.ssh
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f worker || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: playbooks
          configMap:
            name: dookdak-playbooks
        - name: inventory
          persistentVolumeClaim:
            claimName: dookdak-inventory-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: dookdak-artifacts-pvc
        - name: ssh-key
          secret:
            secretName: ansible-ssh-key
            defaultMode: 0400
---
# Worker 스케일링 — on-prem 기준 HPA(CPU). 기본은 위 replicas, 부하 시 자동 확장.
# (큐 깊이 기반 이벤트 오토스케일은 미도입 — replicas 조정 / HPA로 운영)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dookdak-worker-hpa
  namespace: dookdak
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dookdak-worker
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dookdak-worker
  namespace: dookdak
