apiVersion: apps/v1
kind: Deployment
metadata:
  name: dookdak-api
  namespace: dookdak
  labels:
    app: dookdak-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dookdak-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dookdak-api
    spec:
      serviceAccountName: dookdak-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: your-registry/dookdak-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: dookdak-config
            - secretRef:
                name: dookdak-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: playbooks
              mountPath: /opt/dookdak/playbooks
              readOnly: true
            - name: inventory
              mountPath: /opt/dookdak/inventory
            - name: artifacts
              mountPath: /var/lib/dookdak/artifacts
      volumes:
        - name: playbooks
          configMap:
            name: dookdak-playbooks
        - name: inventory
          persistentVolumeClaim:
            claimName: dookdak-inventory-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: dookdak-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dookdak-api-service
  namespace: dookdak
  labels:
    app: dookdak-api
spec:
  selector:
    app: dookdak-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dookdak-api-hpa
  namespace: dookdak
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dookdak-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dookdak-api
  namespace: dookdak
