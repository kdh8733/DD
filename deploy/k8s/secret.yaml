apiVersion: v1
kind: Secret
metadata:
  name: dookdak-secrets
  namespace: dookdak
type: Opaque
# 실제 값은 base64 인코딩 후 입력하거나 External Secrets Operator / Vault 사용
# kubectl create secret generic dookdak-secrets \
#   --from-literal=DATABASE_URL="postgres://..." \
#   --from-literal=REDIS_URL="..." \
#   -n dookdak
stringData:
  DATABASE_URL: "postgres://dookdak:CHANGE_ME@postgres-service:5432/dookdak"
  REDIS_URL: "redis-service:6379"
  REDIS_PASSWORD: ""
  KEYCLOAK_URL: "http://keycloak-service:8080"
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/CHANGE_ME"
  PAGERDUTY_ROUTING_KEY: ""
  TEMPORAL_ADDRESS: "temporal-service:7233"
