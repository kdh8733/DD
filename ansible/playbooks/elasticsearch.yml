---
# ════════════════════════════════════════════
#  Dook-Dak Platform Playbook — elasticsearch.yml
#  Elasticsearch Cluster 관리
#
#  Variables:
#    es_action: rolling_restart | rolling_upgrade | reindex | shard_rebalance | config | status
#    es_version: (upgrade 시) 목표 버전
#    es_http_port: (기본 9200)
#    es_cluster_name: (기본 'elasticsearch')
#    es_heap_size: (기본 '4g')
#    reindex_source: (reindex 시) 소스 인덱스
#    reindex_dest: (reindex 시) 대상 인덱스
# ════════════════════════════════════════════
- name: Elasticsearch Cluster 관리
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: true
  serial: 1  # ES는 항상 1대씩 순차 처리

  vars:
    es_action: "{{ es_action | mandatory }}"
    es_http_port: "{{ es_http_port | default(9200) }}"
    es_transport_port: "{{ es_transport_port | default(9300) }}"
    es_cluster_name: "{{ es_cluster_name | default('elasticsearch') }}"
    es_heap_size: "{{ es_heap_size | default('4g') }}"
    es_conf_path: "/etc/elasticsearch/elasticsearch.yml"
    es_service: "elasticsearch"
    es_api: "http://{{ inventory_hostname }}:{{ es_http_port }}"

  pre_tasks:
    - name: 파라미터 검증
      ansible.builtin.assert:
        that:
          - es_action in ['rolling_restart', 'rolling_upgrade', 'reindex', 'shard_rebalance', 'config', 'status', 'flush', 'shrink']
        fail_msg: "유효하지 않은 es_action: {{ es_action }}"

  tasks:
    # ── Rolling Restart ───────────────────────
    - name: Rolling Restart (샤드 이동 중지 → 재시작 → 재개)
      block:
        - name: "클러스터 상태 확인 (Green이어야 계속 진행)"
          ansible.builtin.uri:
            url: "{{ es_api }}/_cluster/health?wait_for_status=yellow&timeout=60s"
            method: GET
            status_code: 200
          register: cluster_health
          until: cluster_health.json.status in ['green', 'yellow']
          retries: 5
          delay: 10

        - name: "샤드 자동 할당 중지"
          ansible.builtin.uri:
            url: "{{ es_api }}/_cluster/settings"
            method: PUT
            body_format: json
            body:
              persistent:
                cluster.routing.allocation.enable: "none"
            status_code: 200

        - name: "Synced flush 실행"
          ansible.builtin.uri:
            url: "{{ es_api }}/_flush/synced"
            method: POST
            status_code: [200, 409]
          ignore_errors: true

        - name: "Elasticsearch 서비스 재시작"
          ansible.builtin.systemd:
            name: "{{ es_service }}"
            state: restarted

        - name: "노드 복구 대기 (최대 5분)"
          ansible.builtin.uri:
            url: "{{ es_api }}/_cluster/health?wait_for_nodes=1&timeout=300s"
            method: GET
            status_code: 200
          register: node_health
          until: node_health.status == 200
          retries: 30
          delay: 10

        - name: "샤드 자동 할당 재개"
          ansible.builtin.uri:
            url: "{{ es_api }}/_cluster/settings"
            method: PUT
            body_format: json
            body:
              persistent:
                cluster.routing.allocation.enable: "all"
            status_code: 200

        - name: "클러스터 정상화 대기"
          ansible.builtin.uri:
            url: "{{ es_api }}/_cluster/health?wait_for_status=green&timeout=300s"
            method: GET
            status_code: 200
          register: final_health
          until: final_health.json.status == 'green'
          retries: 30
          delay: 10
      when: es_action == 'rolling_restart'

    # ── Status ────────────────────────────────
    - name: 클러스터 상태 확인
      block:
        - name: 클러스터 health 조회
          ansible.builtin.uri:
            url: "{{ es_api }}/_cluster/health?pretty"
            method: GET
          register: health_result

        - name: 노드 목록 조회
          ansible.builtin.uri:
            url: "{{ es_api }}/_cat/nodes?v"
            method: GET
            return_content: true
          register: nodes_result

        - name: 인덱스 상태 조회
          ansible.builtin.uri:
            url: "{{ es_api }}/_cat/indices?v&health=red,yellow"
            method: GET
            return_content: true
          register: indices_result

        - name: 상태 출력
          ansible.builtin.debug:
            msg:
              - "Cluster Status: {{ health_result.json.status }}"
              - "Active Shards: {{ health_result.json.active_shards }}"
              - "Unassigned Shards: {{ health_result.json.unassigned_shards }}"
              - "=== Nodes ==="
              - "{{ nodes_result.content.split('\n') }}"
      when: es_action == 'status'
      run_once: true

    # ── Shard Rebalance ───────────────────────
    - name: 샤드 재분배 설정
      ansible.builtin.uri:
        url: "{{ es_api }}/_cluster/settings"
        method: PUT
        body_format: json
        body:
          persistent:
            cluster.routing.allocation.enable: "all"
            cluster.routing.rebalance.enable: "all"
            cluster.routing.allocation.cluster_concurrent_rebalance: "4"
      when: es_action == 'shard_rebalance'
      run_once: true
