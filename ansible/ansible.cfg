[defaults]
# ── 기본 설정 ──────────────────────────────
host_key_checking = False
forks             = 50
timeout           = 30
gathering         = smart
fact_caching      = jsonfile
fact_caching_connection = /tmp/dookdak_facts
fact_caching_timeout = 3600

# ── 로그 ──────────────────────────────────
log_path = /var/log/ansible.log
# 실행 로그는 ansible-runner가 캡처하므로 stdout_callback 최소화
stdout_callback = yaml
stderr_callback = yaml
display_skipped_hosts = False
display_ok_hosts = True

# ── 성능 최적화 ────────────────────────────
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
internal_poll_interval = 0.001

# ── 재시도 ─────────────────────────────────
# retry_files_enabled = False  # 재시도 파일 비활성화 (ansible-runner가 관리)

# ── 역할 경로 ─────────────────────────────
roles_path = /opt/dookdak/playbooks/roles:~/.ansible/roles:/etc/ansible/roles

# ── 인벤토리 ──────────────────────────────
inventory = /opt/dookdak/inventory

# ── 콜백 플러그인 ──────────────────────────
callback_whitelist = timer, profile_tasks

[inventory]
enable_plugins = ini, yaml, json, host_list

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
ssh_args        = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining      = True
retries         = 3

[persistent_connection]
connect_timeout = 30
command_timeout = 300
